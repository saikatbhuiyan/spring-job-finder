spring.application.name=job-finder

# --- Web / API ------------------------------------------------------------
# Errors use RFC 9457 "Problem Details" (application/problem+json). That is
# done in code, not here: shared/api/GlobalExceptionHandler (errors inside
# Spring MVC) and ProblemDetailsErrorController (filters, servlet container).
# Boot's own spring.mvc.problemdetails.enabled handler would back off anyway,
# so the property is intentionally not set. See docs/adr/0006.

# API versioning (Spring Framework 7 built-in): the version is the 2nd path
# segment, e.g. /api/v1/jobs -> version 1. Controllers declare it with
# @GetMapping(version = "1"). Unknown versions -> 400 Problem Details.
spring.mvc.apiversion.use.path-segment=1

# Dates in query parameters are ISO-8601 only: ?postedAfter=2026-01-15, and
# instants as 2026-01-15T10:00:00Z. By default Spring also accepted the locale's
# short format, where 01/02/26 was read as 2 January (a client meaning 1 February
# got a silently wrong filter). spring.mvc.format.time has no "iso" value (fails
# startup); the API has no time-only parameters. See docs/adr/0011.
spring.mvc.format.date=iso
spring.mvc.format.date-time=iso

# Reject request bodies with properties the DTO doesn't declare (400 Problem
# Details) instead of silently ignoring them: a client typo or a field the API
# doesn't support is reported, not lost. See docs/adr/0005.
spring.jackson.deserialization.fail-on-unknown-properties=true

# Reject values of the wrong JSON type instead of converting them: "5000" for a
# number, "" for a number (would become null), and 2.7 for an integer, which was
# silently truncated to 2. Coercion into strings (123 -> "123") is rejected in
# shared/api/JsonBindingConfig (no property for it). See docs/adr/0009.
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false

# One language for every error response: English, whatever the client's
# Accept-Language or the server's OS locale. By default the request locale
# follows Accept-Language, so Bean Validation messages came back in German or
# French inside an otherwise English problem. Clients localize from the problem
# "type" and "pointer", not from the text. ("fixed" without a locale fails
# startup.) See docs/adr/0006.
spring.web.locale=en
spring.web.locale-resolver=fixed

# CORS: browser origins allowed to call /api/**. Empty by default = no
# cross-origin access until an environment names its frontend explicitly
# (dev profile: localhost dev servers; prod: env JOBFINDER_CORS_ALLOWEDORIGINS).
# Validated at startup. See shared/api/CorsConfig and docs/adr/0007.
jobfinder.cors.allowed-origins=

# Rate limit per client (remote address) on /api/**: a token bucket of 60
# requests, refilled in 1 minute. Over the limit: 429 + Retry-After. The client
# address is the TCP peer, so behind a reverse proxy configure Tomcat's
# RemoteIpValve for that proxy only (never trust X-Forwarded-For from anyone).
# In-memory: per instance. See shared/api/RateLimitConfig and docs/adr/0012.
jobfinder.rate-limit.requests=60
jobfinder.rate-limit.period=1m
jobfinder.rate-limit.max-clients=100000

# Idempotency keys for POST/PATCH on /api/** (Idempotency-Key header): the first
# 2xx response for a key is kept for key-ttl and replayed to retries of the same
# request; the key with a different request is a 422, a retry while the first
# is still running a 409. Endpoints marked @Idempotent require a key. The body is
# buffered to fingerprint it, hence the size limit (413 beyond it). In memory:
# per instance and lost on restart. See shared/api/IdempotencyFilter, docs/adr/0014.
jobfinder.idempotency.key-ttl=24h
jobfinder.idempotency.max-request-size=1MB
jobfinder.idempotency.max-stored-size=64MB

# --- Tracing / request correlation -------------------------------------------
# Every request belongs to a W3C trace: a new one, or the caller's (traceparent
# header). Its trace ID is in every log line (MDC traceId/spanId), in the
# X-Trace-Id response header and in Problem Details ("traceId"). Spans are not
# exported yet (no exporter on the classpath): sampling decides only what an
# exporter would receive, never whether a request gets a trace ID. See
# shared/api/TraceIdFilter and docs/adr/0013.
#
# Accept and send only W3C traceparent; by default Boot also accepted two B3
# header formats from any client.
management.tracing.propagation.type=w3c
# No baggage: by default a client's "baggage" header (any key=value pairs) was
# forwarded on every outgoing call. Nothing here reads baggage.
management.tracing.baggage.enabled=false

# --- Actuator -------------------------------------------------------------
# Only expose the health endpoint over HTTP (this is also Boot's default;
# stated explicitly so adding more endpoints later is a deliberate choice).
management.endpoints.web.exposure.include=health

# Add /actuator/health/liveness and /actuator/health/readiness, used by
# Docker/Kubernetes to decide whether to restart the app or send it traffic.
management.endpoint.health.probes.enabled=true

# Health details (disk space, database status...) stay hidden from callers.
# Default is "never"; don't change it to "always" in production.
management.endpoint.health.show-details=never
