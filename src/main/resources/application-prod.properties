# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.

# --- Logging ----------------------------------------------------------------
# Structured JSON logs in Elastic Common Schema (ECS) format: one JSON object per line,
# exceptions included as fields (error.type / error.message / error.stack_trace), so log
# platforms (Elastic, Grafana Loki, Datadog, CloudWatch...) can index and query them.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=prod
# The request's trace and span IDs under their ECS names (trace.id / span.id), the fields Elastic and
# other ECS tools join logs and traces on. Boot writes the MDC keys as they are (traceId / spanId).
logging.structured.json.rename.traceId=trace.id
logging.structured.json.rename.spanId=span.id
logging.level.root=INFO
