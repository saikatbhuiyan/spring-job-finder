# Production profile. Activate with SPRING_PROFILES_ACTIVE=prod.

# --- Logging ----------------------------------------------------------------
# Structured JSON logs in Elastic Common Schema (ECS) format: one JSON object per line,
# exceptions included as fields (error.type / error.message / error.stack_trace), so log
# platforms (Elastic, Grafana Loki, Datadog, CloudWatch...) can index and query them.
logging.structured.format.console=ecs
logging.structured.ecs.service.environment=prod
logging.level.root=INFO
