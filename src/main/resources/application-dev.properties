# Local development profile.
# Active automatically with `mvn spring-boot:run` (see spring-boot-maven-plugin in pom.xml);
# never active in the packaged jar unless explicitly requested.

# --- Logging ----------------------------------------------------------------
# Compact, colored, human-readable console output, with the request's trace ID (the X-Trace-Id
# response header; blank outside a request):
#   22:15:03.123 DEBUG [http-nio-8080-e] 4bf92f3577b34da6a3ce929d0e0e4736 c.s.jobfinder.job.JobService : message
logging.pattern.console=%clr(%d{HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%-15.15t]){faint} %clr(%-32.32X{traceId:-}){magenta} %clr(%-36.36logger{35}){cyan} %clr(:){faint} %m%n%wEx

# Our own code at DEBUG; frameworks stay at INFO to keep the console readable.
logging.level.com.shahabuddin.jobfinder=DEBUG

# --- Actuator -------------------------------------------------------------
# Show health details locally (disk space, DB status...). Never in prod.
management.endpoint.health.show-details=always

# --- CORS -------------------------------------------------------------------
# Typical local frontend dev servers (Vite, Create React App / Next.js). Other
# environments set their own list, e.g. JOBFINDER_CORS_ALLOWEDORIGINS=https://app.example.com
jobfinder.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# --- API documentation ------------------------------------------------------
# The OpenAPI document (http://localhost:8080/v3/api-docs, .yaml) and Swagger UI
# (http://localhost:8080/swagger-ui.html) locally only; off everywhere else (ADR 0016).
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
