# Test-only overrides, layered on top of src/main/resources/application.properties
# (Spring Boot reads classpath:/config/ after classpath:/ and lets it win key by key;
# the main file is not replaced).

# All test requests come from 127.0.0.1, so the production limit (60 per minute)
# would make unrelated tests fail with 429 once a test class sends enough requests.
# RateLimitTests sets its own small limit and tests the limiter itself.
jobfinder.rate-limit.requests=100000
